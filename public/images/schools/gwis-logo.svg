<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gwis-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gwis-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="gwis-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#047857" stroke-width="4" filter="url(#gwis-shadow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Inner Badge Center -->
  <circle cx="100" cy="96" r="48" fill="url(#gwis-green)" stroke="url(#gwis-orange)" stroke-width="2.5" />

  <!-- Spreading Tree of Knowledge / Globe Motif inside Badge -->
  <!-- Tree Canopy -->
  <path d="M 100 64 C 90 64 80 72 82 82 C 76 83 72 88 74 94 C 74 98 78 102 82 102 C 86 102 96 102 100 102 C 104 102 114 102 118 102 C 122 102 126 98 126 94 C 128 88 124 83 118 82 C 120 72 110 64 100 64 Z" fill="#ffffff" opacity="0.95" />
  <!-- Tree Trunk / Book Base -->
  <path d="M 96 102 L 94 116 L 106 116 L 104 102 Z" fill="url(#gwis-orange)" />
  <path d="M 86 118 Q 100 114 114 118 L 118 123 Q 100 119 82 123 Z" fill="#ffffff" />

  <!-- Rising Star -->
  <polygon points="100,52 102,57 107,57 103,60 105,65 100,62 95,65 97,60 93,57 98,57" fill="url(#gwis-orange)" />

  <!-- Top Title Arch -->
  <text x="100" y="32" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="9" fill="#064e3b" letter-spacing="1.5">GREENWOOD INTL</text>
  <text x="100" y="44" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#ea580c" letter-spacing="1">LEARN &#8226; LEAD &#8226; ASPIRE</text>

  <!-- Bottom Ribbon -->
  <path d="M 38 152 Q 100 168 162 152 L 158 169 Q 100 183 42 169 Z" fill="url(#gwis-green)" stroke="url(#gwis-orange)" stroke-width="1.5"/>
  <text x="100" y="163" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="8" fill="#ffffff" letter-spacing="1.2">BANGALORE &#8226; 2004</text>
</svg>
